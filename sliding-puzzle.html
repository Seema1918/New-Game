<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111a1c">
    <title>Slide Shift</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #111a1c;
            --surface: #1b292b;
            --surface-raised: #243538;
            --ink: #f4f2e9;
            --muted: #a8bab5;
            --line: #35494a;
            --accent: #b9f278;
            --accent-ink: #17231a;
            --tile-ink: #192323;
            --coral: #ff987d;
            --yellow: #f5d36e;
            --mint: #b9f278;
            --blue: #8ed5e0;
            --shadow: rgba(0, 0, 0, 0.24);
        }

        body[data-theme="light"] {
            color-scheme: light;
            --page: #edf2e9;
            --surface: #fbfcf7;
            --surface-raised: #e3ebe0;
            --ink: #1c2b2a;
            --muted: #586c67;
            --line: #c9d6cd;
            --accent: #365d3a;
            --accent-ink: #ffffff;
            --tile-ink: #1c2b2a;
            --coral: #f58a6f;
            --yellow: #eac44d;
            --mint: #a5d874;
            --blue: #77c4d2;
            --shadow: rgba(26, 48, 40, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background-color: var(--page);
            background-image: radial-gradient(var(--line) 0.7px, transparent 0.7px);
            background-size: 19px 19px;
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            line-height: 1.45;
            transition: background-color 180ms ease, color 180ms ease;
        }

        button {
            color: inherit;
            font: inherit;
        }

        .app {
            width: min(1080px, 100%);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 2px 0 26px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--ink);
            font-size: 0.94rem;
            font-weight: 800;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            grid-template-columns: repeat(2, 1fr);
            gap: 3px;
            transform: rotate(-8deg);
        }

        .brand-mark span {
            border-radius: 3px;
            background: var(--coral);
        }

        .brand-mark span:nth-child(2) {
            background: var(--yellow);
        }

        .brand-mark span:nth-child(3) {
            background: var(--blue);
        }

        .brand-mark span:nth-child(4) {
            background: var(--mint);
        }

        .theme-button,
        .quiet-button,
        .primary-button,
        .size-button {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--surface);
            cursor: pointer;
            transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
        }

        .theme-button,
        .quiet-button,
        .primary-button {
            padding: 0 15px;
        }

        .theme-button:hover,
        .quiet-button:hover,
        .size-button:hover {
            border-color: var(--accent);
            background: var(--surface-raised);
        }

        .primary-button {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-ink);
            font-weight: 800;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        button:focus-visible,
        .board:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 3px;
        }

        .game-layout {
            display: grid;
            grid-template-columns: minmax(250px, 0.78fr) minmax(360px, 1.22fr);
            gap: clamp(30px, 7vw, 84px);
            align-items: center;
            padding: 44px 0 24px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 3.4rem;
            font-weight: 500;
            line-height: 0.98;
        }

        h1 span {
            display: block;
            color: var(--coral);
            font-style: italic;
        }

        .intro-copy {
            max-width: 330px;
            margin: 18px 0 28px;
            color: var(--muted);
            font-size: 0.96rem;
        }

        .section-label {
            display: block;
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .size-picker {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
        }

        .size-button {
            min-width: 58px;
            min-height: 37px;
            padding: 0 9px;
            border-color: transparent;
            background: transparent;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .size-button[aria-pressed="true"] {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-ink);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin: 26px 0 22px;
            padding: 14px 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .stat {
            min-width: 0;
            padding: 0 12px;
            border-right: 1px solid var(--line);
        }

        .stat:first-child {
            padding-left: 0;
        }

        .stat:last-child {
            padding-right: 0;
            border-right: 0;
        }

        .stat-label {
            display: block;
            margin-bottom: 2px;
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .stat-value {
            display: block;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.5rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .best-line {
            min-height: 24px;
            margin: 17px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .best-line strong {
            color: var(--ink);
        }

        .board-wrap {
            width: min(100%, 600px);
            justify-self: end;
        }

        .board-heading {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .board {
            display: grid;
            width: 100%;
            aspect-ratio: 1;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 18px 45px var(--shadow);
            touch-action: manipulation;
        }

        .tile {
            display: grid;
            min-width: 0;
            min-height: 0;
            place-items: center;
            border: 0;
            border-radius: 5px;
            background: var(--mint);
            color: var(--tile-ink);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.7rem;
            font-weight: 700;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
            cursor: pointer;
            user-select: none;
            transition: transform 120ms ease, filter 120ms ease, background-color 180ms ease;
        }

        .tile:hover:not(.empty) {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .tile[data-tone="coral"] {
            background: var(--coral);
        }

        .tile[data-tone="yellow"] {
            background: var(--yellow);
        }

        .tile[data-tone="blue"] {
            background: var(--blue);
        }

        .tile.empty {
            border: 1px dashed var(--line);
            background: var(--page);
            box-shadow: inset 0 2px 8px var(--shadow);
            cursor: default;
        }

        .win-message {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
            padding: 12px 14px;
            border-left: 3px solid var(--accent);
            background: var(--surface);
            color: var(--ink);
        }

        .win-message[hidden] {
            display: none;
        }

        .win-message p {
            margin: 0;
            font-weight: 700;
        }

        .win-message button {
            flex: 0 0 auto;
        }

        .footer-note {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.75rem;
        }

        @media (max-width: 760px) {
            body {
                padding: 18px;
            }

            .game-layout {
                grid-template-columns: minmax(0, 1fr);
                gap: 30px;
                padding-top: 30px;
            }

            .board-wrap {
                width: min(100%, 540px);
                justify-self: center;
            }

            h1 {
                font-size: 2.8rem;
            }

            .intro-copy {
                max-width: 460px;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 14px;
            }

            .game-layout {
                gap: 23px;
            }

            h1 {
                font-size: 2.45rem;
            }

            .board {
                gap: 5px;
                padding: 7px;
            }

            .tile {
                font-size: 1.35rem;
            }

            .quiet-button,
            .primary-button {
                padding: 0 12px;
            }

            .footer-note {
                flex-direction: column;
                gap: 3px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Slide Shift home">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
                <span>PLAYROOM / 01</span>
            </a>
            <button class="theme-button" id="themeToggle" type="button">Use light mode</button>
        </header>

        <section class="game-layout" aria-label="Sliding puzzle game">
            <div class="game-info">
                <p class="eyebrow">A little patience. A little pattern.</p>
                <h1>Slide <span>Shift.</span></h1>
                <p class="intro-copy">Put every number back in order. One open space, one move at a time.</p>

                <div>
                    <span class="section-label">Board size</span>
                    <div class="size-picker" role="group" aria-label="Choose board size">
                        <button class="size-button" type="button" data-size="3" aria-pressed="false">3 x 3</button>
                        <button class="size-button" type="button" data-size="4" aria-pressed="true">4 x 4</button>
                        <button class="size-button" type="button" data-size="5" aria-pressed="false">5 x 5</button>
                    </div>
                </div>

                <div class="stats" aria-label="Game statistics">
                    <div class="stat">
                        <span class="stat-label">Moves</span>
                        <span class="stat-value" id="moves" aria-live="polite">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Time</span>
                        <span class="stat-value" id="timer" aria-live="off">00:00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Best</span>
                        <span class="stat-value" id="best">--</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="primary-button" id="newGame" type="button">New puzzle</button>
                    <button class="quiet-button" id="undo" type="button" disabled>Undo</button>
                    <button class="quiet-button" id="restart" type="button">Restart</button>
                </div>
                <p class="best-line" id="bestTime" aria-live="polite"></p>
            </div>

            <div class="board-wrap">
                <div class="board-heading"><span id="boardLabel">4 by 4</span><span>Arrange ascending</span></div>
                <div class="board" id="board" role="grid" aria-label="Sliding puzzle board" tabindex="0"></div>
                <div class="win-message" id="winMessage" role="status" hidden>
                    <p>Puzzle complete. Nicely done.</p>
                    <button class="primary-button" id="playAgain" type="button">Play again</button>
                </div>
            </div>
        </section>

        <footer class="footer-note">
            <span>SLIDE SHIFT</span>
            <span>Made for one more round.</span>
        </footer>
    </main>

    <script>
        const boardElement = document.querySelector('#board');
        const movesElement = document.querySelector('#moves');
        const timerElement = document.querySelector('#timer');
        const bestElement = document.querySelector('#best');
        const bestTimeElement = document.querySelector('#bestTime');
        const boardLabel = document.querySelector('#boardLabel');
        const undoButton = document.querySelector('#undo');
        const winMessage = document.querySelector('#winMessage');
        const sizeButtons = [...document.querySelectorAll('.size-button')];

        let size = 4;
        let tiles = [];
        let startingTiles = [];
        let history = [];
        let moves = 0;
        let seconds = 0;
        let timerId = null;
        let started = false;
        let finished = false;

        function formatTime(value) {
            const minutes = Math.floor(value / 60).toString().padStart(2, '0');
            const remainingSeconds = (value % 60).toString().padStart(2, '0');
            return `${minutes}:${remainingSeconds}`;
        }

        function saveData(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch {
                return;
            }
        }

        function loadData(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key)) ?? fallback;
            } catch {
                return fallback;
            }
        }

        function updateBest() {
            const scores = loadData('slideShiftBests', {});
            const best = scores[size];
            bestElement.textContent = best ? best.moves : '--';
            bestTimeElement.textContent = best ? `Personal best: ${best.moves} moves in ${formatTime(best.seconds)}.` : 'No personal best yet.';
        }

        function updateStats() {
            movesElement.textContent = moves;
            timerElement.textContent = formatTime(seconds);
            undoButton.disabled = history.length === 0 || finished;
        }

        function renderBoard() {
            boardElement.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
            boardElement.setAttribute('aria-label', `${size} by ${size} sliding puzzle board`);
            boardElement.innerHTML = '';

            tiles.forEach((value, index) => {
                if (value === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'tile empty';
                    empty.setAttribute('role', 'gridcell');
                    empty.setAttribute('aria-label', 'Empty space');
                    boardElement.appendChild(empty);
                    return;
                }

                const tile = document.createElement('button');
                const tone = ['mint', 'coral', 'yellow', 'blue'][value % 4];
                tile.className = 'tile';
                tile.type = 'button';
                tile.dataset.index = index;
                tile.dataset.tone = tone;
                tile.setAttribute('role', 'gridcell');
                tile.setAttribute('aria-label', `Tile ${value}`);
                tile.tabIndex = -1;
                tile.textContent = value;
                boardElement.appendChild(tile);
            });
        }

        function stopTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function startTimer() {
            if (started) return;
            started = true;
            timerId = setInterval(() => {
                seconds += 1;
                timerElement.textContent = formatTime(seconds);
            }, 1000);
        }

        function isAdjacent(first, second) {
            const firstRow = Math.floor(first / size);
            const firstColumn = first % size;
            const secondRow = Math.floor(second / size);
            const secondColumn = second % size;
            return Math.abs(firstRow - secondRow) + Math.abs(firstColumn - secondColumn) === 1;
        }

        function moveTile(index, record = true) {
            if (finished || !isAdjacent(index, tiles.indexOf(0))) return;
            startTimer();
            const emptyIndex = tiles.indexOf(0);
            if (record) history.push(tiles.slice());
            [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
            moves += 1;
            renderBoard();
            updateStats();
            boardElement.focus({ preventScroll: true });
            checkWin();
        }

        function checkWin() {
            const solved = tiles.every((value, index) => value === (index === tiles.length - 1 ? 0 : index + 1));
            if (!solved) return;

            finished = true;
            stopTimer();
            winMessage.hidden = false;
            const scores = loadData('slideShiftBests', {});
            const previous = scores[size];
            if (!previous || moves < previous.moves || (moves === previous.moves && seconds < previous.seconds)) {
                scores[size] = { moves, seconds };
                saveData('slideShiftBests', scores);
            }
            updateBest();
            updateStats();
        }

        function resetCounters() {
            stopTimer();
            history = [];
            moves = 0;
            seconds = 0;
            started = false;
            finished = false;
            winMessage.hidden = true;
            updateStats();
        }

        function restartPuzzle() {
            tiles = startingTiles.slice();
            resetCounters();
            renderBoard();
            boardElement.focus({ preventScroll: true });
        }

        function shufflePuzzle() {
            const count = size * size;
            const shuffled = Array.from({ length: count - 1 }, (_, index) => index + 1);
            shuffled.push(0);
            let emptyIndex = count - 1;
            let previousIndex = -1;
            const shuffleSteps = size * size * 18;

            for (let step = 0; step < shuffleSteps; step += 1) {
                const neighbors = [];
                const row = Math.floor(emptyIndex / size);
                const column = emptyIndex % size;
                if (row > 0) neighbors.push(emptyIndex - size);
                if (row < size - 1) neighbors.push(emptyIndex + size);
                if (column > 0) neighbors.push(emptyIndex - 1);
                if (column < size - 1) neighbors.push(emptyIndex + 1);
                const options = neighbors.filter((index) => index !== previousIndex);
                const nextIndex = options[Math.floor(Math.random() * options.length)];
                [shuffled[emptyIndex], shuffled[nextIndex]] = [shuffled[nextIndex], shuffled[emptyIndex]];
                previousIndex = emptyIndex;
                emptyIndex = nextIndex;
            }

            return shuffled;
        }

        function newPuzzle(nextSize = size) {
            size = nextSize;
            startingTiles = shufflePuzzle();
            tiles = startingTiles.slice();
            resetCounters();
            boardLabel.textContent = `${size} by ${size}`;
            sizeButtons.forEach((button) => {
                button.setAttribute('aria-pressed', String(Number(button.dataset.size) === size));
            });
            updateBest();
            renderBoard();
        }

        function undoMove() {
            if (history.length === 0 || finished) return;
            tiles = history.pop();
            moves = Math.max(0, moves - 1);
            renderBoard();
            updateStats();
            boardElement.focus({ preventScroll: true });
        }

        boardElement.addEventListener('click', (event) => {
            const tile = event.target.closest('button[data-index]');
            if (tile) moveTile(Number(tile.dataset.index));
        });

        boardElement.addEventListener('keydown', (event) => {
            const directions = {
                ArrowUp: -size,
                ArrowDown: size,
                ArrowLeft: -1,
                ArrowRight: 1
            };
            const delta = directions[event.key];
            if (delta === undefined) return;
            event.preventDefault();

            const emptyIndex = tiles.indexOf(0);
            const targetIndex = emptyIndex - delta;
            if (targetIndex < 0 || targetIndex >= tiles.length || !isAdjacent(emptyIndex, targetIndex)) return;
            moveTile(targetIndex);
        });

        document.querySelector('#newGame').addEventListener('click', () => newPuzzle());
        document.querySelector('#restart').addEventListener('click', restartPuzzle);
        document.querySelector('#undo').addEventListener('click', undoMove);
        document.querySelector('#playAgain').addEventListener('click', () => newPuzzle());
        sizeButtons.forEach((button) => {
            button.addEventListener('click', () => newPuzzle(Number(button.dataset.size)));
        });

        const themeToggle = document.querySelector('#themeToggle');
        function applyTheme(theme) {
            const selectedTheme = theme === 'light' ? 'light' : 'dark';
            document.body.dataset.theme = selectedTheme;
            themeToggle.textContent = selectedTheme === 'dark' ? 'Use light mode' : 'Use dark mode';
            themeToggle.setAttribute('aria-label', `Switch to ${selectedTheme === 'dark' ? 'light' : 'dark'} mode`);
            saveData('slideShiftTheme', selectedTheme);
        }

        themeToggle.addEventListener('click', () => {
            applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
        });

        applyTheme(loadData('slideShiftTheme', 'dark'));
        newPuzzle(4);
    </script>
</body>
</html>
